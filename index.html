  }
}

}

.eyebrow{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;line-height:1;
  font-size:clamp(34px,7vw,56px);margin:0;text-wrap:balance}
.sub{margin:16px 0 0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);max-width:52ch}
.hero{display:block;width:100%;height:auto;margin:28px 0 2px;border-radius:14px;border:1px solid var(--hair)}
#chirp{display:block;width:100%;height:46px;margin:22px 0 4px;opacity:.9}

.group{margin-top:40px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:12px;border-bottom:1px solid var(--hair);margin-bottom:18px}
.group-head h2{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.group-head .note{font-size:13px;color:var(--muted);text-align:right}

.blurb{margin:-2px 0 14px;color:var(--muted);max-width:62ch}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin:0 0 20px}
@media (max-width:560px){.feats{grid-template-columns:1fr;gap:12px}}
.feat{font-size:14.5px;color:var(--muted);line-height:1.45}
.feat b{display:block;font-family:var(--disp);font-weight:600;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink);opacity:.85;margin-bottom:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;border:1px solid var(--hair);background:var(--panel);border-radius:14px;
  padding:8px 8px 12px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  text-align:left;font:inherit;color:inherit;width:100%;display:block}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ph{aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:var(--panel2)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .meta{display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 2px}
.tile .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.tile .cname{font-family:var(--disp);font-weight:600;font-size:14px}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.tile .check{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;
  background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tile[aria-pressed="true"] .check{display:flex}
.tile.dim{opacity:.5}
.tile.locked{cursor:default}
.tile.locked:hover{transform:none;box-shadow:none}

/* panel / form */
.panel{margin-top:34px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;
  padding:22px;box-shadow:var(--shadow)}
.field label{display:block;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--panel2);
  border:1px solid var(--hair);border-radius:10px;padding:12px 14px}
.field input::placeholder{color:var(--muted);opacity:.7}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.btn{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;
  background:var(--accent);color:#04222a;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;
  transition:filter .15s ease,transform .15s ease}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#04222a}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pick-hint{font-size:13.5px;color:var(--muted)}
.err{color:#d7443b;font-size:13.5px;margin-top:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8b83}}

/* confirmation + results */
.done h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.done p{margin:0;color:var(--muted)}
.yourpick{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;
  background:var(--accent-soft);border:1px solid var(--hair);border-radius:12px;font-family:var(--disp);font-weight:600}
.yourpick .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.results{margin-top:26px}
.results h3{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:0 0 14px}
.bar{margin:0 0 11px}
.bar .lab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;margin-bottom:5px}
.bar .lab .l{display:flex;align-items:center;gap:8px}
.bar .lab .dot{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.bar .lab .n{color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.results .prodname{font-family:var(--disp);font-weight:700;font-size:14px;margin:18px 0 10px}
.results .prodname:first-child{margin-top:0}
.total{margin-top:18px;font-size:13.5px;color:var(--muted)}
.change{margin-top:16px}
.dlrow{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--panel2);filter:none}
.dlmsg{font-size:13px;color:var(--muted)}
.orggate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.orggate input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;max-width:220px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.footer{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.readonly-note{margin-top:14px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

      {key:"tuscan",name:"Tuscan",hex:"#b3654c",img:IMG.bot_tuscan},
      {key:"pinot",name:"Pinot",hex:"#6a1f37",img:IMG.bot_pinot}
    ]}
  ];

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function readState(){try{return JSON.parse($("state").textContent)||{responses:[]};}catch(e){return {responses:[]};}}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null;}}
  function voterId(){var v=ls("ozgrav_voter");if(!v){v="v"+Math.random().toString(36).slice(2)+Date.now().toString(36);ls("ozgrav_voter",v);}return v;}
  function findColour(pk,ck){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].key===pk){for(var j=0;j<PRODUCTS[i].colours.length;j++){if(PRODUCTS[i].colours[j].key===ck)return {p:PRODUCTS[i],c:PRODUCTS[i].colours[j]};}}}return null;}
  function prodName(k){var f=null;PRODUCTS.forEach(function(p){if(p.key===k)f=p.name;});return f||k;}

  // The in-page tally only works where the page can save new versions of itself
  // (the artifact runtime). On the static site picks go to Formspree instead,
  // so the counters would sit at zero for everyone — hide them there.
  function liveTally(){return !!(window.claude&&window.claude.use);}

  // latest response per voter
  function latest(state){var m={};(state.responses||[]).forEach(function(r){var p=m[r.voter];if(!p||r.ts>p.ts)m[r.voter]=r;});return Object.keys(m).map(function(k){return m[k];});}

  function buildDoc(state){
    var css=$("app-style").textContent, js=$("app-code").textContent;
    return "<!doctype html>\n<html lang=\"en\"><head>\n"
      +"<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
      +"<title>OzGrav Retreat Merch</title>\n"
      +"<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n"
      +"<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n"
      +"<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n"
      +"<style id=\"app-style\">"+css+"<\/style>\n"
      +"</head><body>\n<div id=\"app\"></div>\n"
      +"<script id=\"state\" type=\"application/json\">"+JSON.stringify(state)+"<\/script>\n"
      +"<script id=\"app-code\">"+js+"<\/script>\n"
      +"</body></html>";
  }

  var selected=null; // {product,colour}

  function myPick(state){
    var vid=voterId();
    var mine=null;
    latest(state).forEach(function(r){if(r.voter===vid)mine=r;});
    if(!mine){var local=ls("ozgrav_local_pick");if(local){try{var p=JSON.parse(local);mine={voter:vid,name:p.name,product:p.product,colour:p.colour,ts:p.ts,via:p.via,local:true};}catch(e){}}}
    return mine;
  }

  function tilesHTML(mine){
    var locked=!!mine;
    var out="";
    PRODUCTS.forEach(function(p){
      out+='<section class="group"><div class="group-head"><h2>'+esc(p.name)+'</h2><span class="note">'+esc(p.note)+' · six colours</span></div>'
        +(p.blurb?'<p class="blurb">'+esc(p.blurb)+'</p>':'')
        +(p.feats?'<div class="feats">'+p.feats.map(function(f){return '<div class="feat"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>';}).join('')+'</div>':'')
        +'<div class="tiles">';
      p.colours.forEach(function(c){
        var isMine=mine&&mine.product===p.key&&mine.colour===c.key;
        var press=(!locked&&selected&&selected.product===p.key&&selected.colour===c.key)||isMine;
        var cls="tile"+(locked?" locked":"")+(locked&&!isMine?" dim":"");
        out+='<button type="button" class="'+cls+'" aria-pressed="'+(press?"true":"false")+'" data-p="'+p.key+'" data-c="'+c.key+'"'+(locked?" disabled":"")+'>'
          +'<span class="ph"><img src="'+c.img+'" alt="'+esc(p.name+" — "+c.name)+'" loading="lazy"></span>'
          +'<span class="meta"><span class="dot" style="background:'+c.hex+'"></span><span class="cname">'+esc(c.name)+'</span></span>'
          +'<span class="check" aria-hidden="true">&#10003;</span></button>';
      });
      out+='</div></section>';
    });
    return out;
  }

  function resultsHTML(state){
    var rows=latest(state);
    var total=rows.length;
    var counts={};
    rows.forEach(function(r){var k=r.product+"|"+r.colour;counts[k]=(counts[k]||0)+1;});
    var max=1;Object.keys(counts).forEach(function(k){if(counts[k]>max)max=counts[k];});
    var html='<div class="results"><h3>Picks so far</h3>';
    PRODUCTS.forEach(function(p){
      html+='<div class="prodname">'+esc(p.name)+'</div>';
      p.colours.forEach(function(c){
        var n=counts[p.key+"|"+c.key]||0;
        var pct=Math.round((n/max)*100);
        html+='<div class="bar"><div class="lab"><span class="l"><span class="dot" style="background:'+c.hex+'"></span>'+esc(c.name)+'</span><span class="n">'+n+'</span></div>'
          +'<div class="track"><div class="fill" style="width:'+(n?Math.max(pct,6):0)+'%"></div></div></div>';
      });
    });
    html+='<div class="total">'+total+' '+(total===1?"person has":"people have")+' chosen so far.</div>';
    html+='</div>';
    return html;
  }

  function panelVote(){
    return '<div class="panel"><div class="field"><label for="nm">Your name</label>'
      +'<input id="nm" type="text" autocomplete="name" placeholder="e.g. Alex Nguyen" maxlength="80"></div>'
      +'<input id="trap" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0">'
      +'<div class="row"><button id="go" class="btn" disabled>Confirm my pick</button>'
      +'<span class="pick-hint" id="hint">Pick one product and one colour above.</span></div>'
      +'<div class="err" id="err" style="display:none"></div></div>';
  }

  function panelDone(state,mine){
    var fc=findColour(mine.product,mine.colour);
    var cname=fc?fc.c.name:mine.colour, hex=fc?fc.c.hex:"#888";
    var msg=mine.local
      ? (mine.via==="formspree"
          ? "Your pick has been sent to the organisers. Thanks!"
          : "Your pick has been emailed to Carl. Thanks!")
      : "You're locked in. Change it any time before we order.";
    return '<div class="panel done"><h2>Thanks, '+esc(mine.name)+'.</h2><p>'+esc(msg)+'</p>'
      +'<div class="yourpick"><span class="dot" style="background:'+hex+'"></span>'+esc(prodName(mine.product))+' &middot; '+esc(cname)+'</div>'
      +(liveTally()?resultsHTML(state):'')
      +'<div class="change"><button type="button" class="linkbtn" id="change">Change my pick</button></div></div>';
  }

  function render(){
    var state=readState();
    var mine=render._force?null:myPick(state);
    var app=$("app");
    app.innerHTML=
      '<div class="wrap">'
      +'<div class="brand" role="img" aria-label="OzGrav"></div>'
      +'<p class="eyebrow">Annual Retreat 2026</p>'
      +'<h1>Pick your merch.</h1>'
      +'<p class="sub">One keepsake for the retreat, made by Fressko. Both products come in the same six colourways — choose <strong>one product</strong> and <strong>one colour</strong>, then add your name so we order the right ones.</p>'
      +'<img class="hero" src="'+IMG.hero+'" alt="OzGrav-branded Camino cup in Emerald and Move bottle in Coal, with close-ups of the cup\'s click-back lid and the bottle\'s sports lid">'
      +'<canvas id="chirp" aria-hidden="true"></canvas>'
      +tilesHTML(mine)
      +(mine?panelDone(state,mine):panelVote()+(liveTally()?resultsHTML(state):''))
      +'<p class="footer">OzGrav — ARC Centre of Excellence for Gravitational Wave Discovery. Questions? <a href="mailto:'+CONTACT+'" style="color:var(--accent)">'+CONTACT+'</a></p>'
      +'</div>';
    if(mine){wireDone();}else{wireVote();}
    drawChirp();
  }

  function wireVote(){
    var btns=document.querySelectorAll(".tile");
    btns.forEach(function(b){
      b.addEventListener("click",function(){
        selected={product:b.getAttribute("data-p"),colour:b.getAttribute("data-c")};
        document.querySelectorAll(".tile").forEach(function(x){x.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");
        updateGo();
      });
    });
    var nm=$("nm"); if(nm)nm.addEventListener("input",updateGo);
    var go=$("go"); if(go)go.addEventListener("click",submit);
  }
  function updateGo(){
    var nm=$("nm"),go=$("go"),hint=$("hint");
    var ok=selected&&nm&&nm.value.trim().length>0;
    if(go)go.disabled=!ok;
    if(hint){hint.textContent=!selected?"Pick one product and one colour above.":(nm&&nm.value.trim()?"Ready — confirm your pick.":"Add your name to confirm.");}
  }
  function wireDone(){var c=$("change");if(c)c.addEventListener("click",function(){render._force=true;selected=null;render();render._force=false;});}

  function showErr(m){var e=$("err");if(e){e.textContent=m;e.style.display="block";}}

  // POST every confirmed pick to Formspree (works on the public site; blocked inside the
  // artifact sandbox, where the pick is stored in the page itself instead).
  function postFormspree(resp){
    if(!FORMSPREE||!window.fetch)return Promise.resolve(false);
    var fc=findColour(resp.product,resp.colour);
    var body={
      name:resp.name,
      product:prodName(resp.product),
      colour:fc?fc.c.name:resp.colour,
      _subject:"OzGrav retreat merch \u2014 "+resp.name,
      _gotcha:resp.trap||""
    };
    return fetch(FORMSPREE,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return !!(r&&r.ok);}).catch(function(){return false;});
  }

  function localConfirm(resp){
    resp.via="formspree";
    ls("ozgrav_local_pick",JSON.stringify(resp));
    ss("ozgrav_pending",null);
    render();
  }

  function emailFallback(resp){
    var subject="OzGrav retreat merch — "+resp.name;
    var body="Name: "+resp.name+"\nProduct: "+prodName(resp.product)+"\nColour: "+(findColour(resp.product,resp.colour)||{c:{name:resp.colour}}).c.name+"\n";
    ls("ozgrav_local_pick",JSON.stringify(resp));
    ss("ozgrav_pending",null);
    try{window.location.href="mailto:"+CONTACT+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);}catch(e){}
    render();
  }

  function applyToState(state,resp){
    var out=(state.responses||[]).filter(function(r){return r.voter!==resp.voter;});
    out.push(resp); return {responses:out};
  }

  function submit(){
    var nm=$("nm");
    var trap=$("trap");
    var resp={voter:voterId(),name:nm.value.trim(),product:selected.product,colour:selected.colour,ts:Date.now(),trap:trap?trap.value:""};
    if(!resp.name||!selected)return;
    var go=$("go"); if(go){go.disabled=true;go.textContent="Saving…";}
    ss("ozgrav_pending",JSON.stringify(resp));
    var sent=postFormspree(resp);
    function offline(){return sent.then(function(ok){ok?localConfirm(resp):emailFallback(resp);});}
    var p=(window.claude&&window.claude.use)?window.claude.use("artifact"):Promise.resolve(null);
    Promise.resolve(p).then(function(art){
      if(!art){offline();return;}
      var next=applyToState(readState(),resp);
      return art.publish(buildDoc(next)).then(function(){
        ls("ozgrav_local_pick",JSON.stringify(resp)); // for instant echo if reload lags
        // view will reload to the new version
      }).catch(function(e){
        var code=e&&e.code;
        if(code==="conflict"){/* platform reloads; pending re-applies on load */}
        else if(code==="not_writer"||code==="not_granted"||code==="capability_disabled"||code==="capability_removed"||code==="consent_required"||code==="not_declared"||code==="read_only_path"){offline();}
        else if(code==="rate_limited"){showErr("Too many saves at once — give it a few seconds and try again.");if(go){go.disabled=false;go.textContent="Confirm my pick";}}
        else{showErr("Couldn’t save your pick — please try again.");if(go){go.disabled=false;go.textContent="Confirm my pick";}}
      });
    });
  }

  // conflict recovery: if our pending vote didn't land, retry (bounded) after reload
  function recover(){
    var pend=ss("ozgrav_pending"); if(!pend)return;
    var p; try{p=JSON.parse(pend);}catch(e){ss("ozgrav_pending",null);return;}
    var state=readState();
    var landed=(state.responses||[]).some(function(r){return r.voter===p.voter&&r.ts===p.ts;});
    if(landed){ss("ozgrav_pending",null);ss("ozgrav_tries",null);ls("ozgrav_local_pick",JSON.stringify(p));return;}
    var tries=+(ss("ozgrav_tries")||0);
    if(tries>=6||!(window.claude&&window.claude.use)){ss("ozgrav_pending",null);ss("ozgrav_tries",null);return;}
    ss("ozgrav_tries",tries+1);
    window.claude.use("artifact").then(function(art){
      if(!art){ss("ozgrav_pending",null);return;}
      return art.publish(buildDoc(applyToState(readState(),p))).catch(function(){/* conflict -> reload retries */});
    });
  }

  // gravitational-wave chirp line in the header
  function drawChirp(){
    var c=$("chirp"); if(!c)return;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var ctx=c.getContext&&c.getContext("2d"); if(!ctx)return;
    var dpr=Math.min(window.devicePixelRatio||1,2),t0=null,raf=null;
    function size(){c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
    function col(){return getComputedStyle(document.documentElement).getPropertyValue("--accent")||"#5BC7DE";}
    function frame(ts){
      if(t0==null)t0=ts;var el=(ts-t0)/1000;
      var w=c.clientWidth,h=c.clientHeight,mid=h/2;
      ctx.clearRect(0,0,w,h);ctx.lineWidth=2;ctx.strokeStyle=col().trim();ctx.globalAlpha=.9;ctx.beginPath();
      for(var x=0;x<=w;x+=2){
        var u=x/w;
        var freq=6+Math.pow(u,3)*46;            // frequency sweeps up (chirp)
        var amp=(h*0.34)*Math.pow(u,1.6)*(1-Math.pow(Math.max(0,u-0.86)/0.14,2)||1);
        if(u>0.9)amp*=(1-(u-0.9)/0.1);          // ring-down
        var ph=reduce?0:el*2.2;
        var y=mid+Math.sin(u*freq+ph)*amp;
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.globalAlpha=1;
      if(!reduce)raf=requestAnimationFrame(frame);
    }
    size();
    if(drawChirp._raf)cancelAnimationFrame(drawChirp._raf);
    if(reduce){frame(0);}else{raf=requestAnimationFrame(frame);drawChirp._raf=raf;}
    if(!drawChirp._bound){window.addEventListener("resize",function(){size();});drawChirp._bound=true;}
  }

  function init(){recover();render();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body></html>
