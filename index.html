<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OzGrav Retreat Merch</title>
<meta name="description" content="Choose your OzGrav 2026 retreat merch — one product, one colour.">
<meta property="og:title" content="OzGrav Retreat Merch 2026">
<meta property="og:description" content="Pick your cup or bottle colour for the annual retreat.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F7; --panel:#FFFFFF; --panel2:#F6F7FA; --ink:#141821; --muted:#5B6473;
  --hair:rgba(20,24,33,.13); --accent:#0E8FA8; --accent-soft:rgba(14,143,168,.12);
  --ring:rgba(14,143,168,.55); --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 30px rgba(20,24,33,.06);
  --disp:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E15; --panel:#141924; --panel2:#1A2130; --ink:#ECEFF5; --muted:#98A2B3;
  --hair:rgba(236,239,245,.12); --accent:#5BC7DE; --accent-soft:rgba(91,199,222,.14);
  --ring:rgba(91,199,222,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0B0E15; --panel:#141924; --panel2:#1A2130; --ink:#ECEFF5; --muted:#98A2B3;
  --hair:rgba(236,239,245,.12); --accent:#5BC7DE; --accent-soft:rgba(91,199,222,.14);
  --ring:rgba(91,199,222,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 72px}
.eyebrow{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;line-height:1;font-size:clamp(34px,7vw,56px);margin:0;text-wrap:balance}
.sub{margin:16px 0 0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);max-width:52ch}
.sub strong{color:var(--ink);font-weight:600}
#chirp{display:block;width:100%;height:46px;margin:22px 0 4px;opacity:.9}
.group{margin-top:40px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--hair);margin-bottom:18px}
.group-head h2{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.group-head .note{font-size:13px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;border:1px solid var(--hair);background:var(--panel);border-radius:14px;padding:8px 8px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;font:inherit;color:inherit;width:100%;display:block}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ph{aspect-ratio:4/5;border-radius:9px;overflow:hidden;background:var(--panel2)}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .meta{display:flex;align-items:center;gap:8px;margin-top:9px;padding:0 2px}
.tile .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.tile .cname{font-family:var(--disp);font-weight:600;font-size:14px}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.tile .check{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tile[aria-pressed="true"] .check{display:flex}
.tile.dim{opacity:.5}
.tile.locked{cursor:default}.tile.locked:hover{transform:none;box-shadow:none}
.panel{margin-top:34px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field .opt{text-transform:none;letter-spacing:0;color:var(--muted);opacity:.7;font-weight:500}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--hair);border-radius:10px;padding:12px 14px}
.field input::placeholder{color:var(--muted);opacity:.7}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.btn{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;background:var(--accent);color:#04222a;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;transition:filter .15s,transform .15s}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pick-hint{font-size:13.5px;color:var(--muted)}
.done h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.done p{margin:0;color:var(--muted)}
.yourpick{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:10px 14px;background:var(--accent-soft);border:1px solid var(--hair);border-radius:12px;font-family:var(--disp);font-weight:600}
.yourpick .dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.change{margin-top:16px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.footer{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
.footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  // (e.g. "https://formspree.io/f/xxxxxxx"). Leave "" to email picks instead.
  var FORM_ENDPOINT = "https://formspree.io/f/xjybnpkz";
  var PRODUCTS = [
    { key:"cup", name:"Fressko Camino cup", note:"Reusable coffee cup", colours:[
      {key:"coal",name:"Coal",hex:"#2b2b2d",img:IMG.cup_coal},
      {key:"breezy",name:"Breezy",hex:"#b7d8d1",img:IMG.cup_breezy},
      {key:"oat",name:"Oat",hex:"#d7ccb7",img:IMG.cup_oat},
      {key:"tuscan",name:"Tuscan",hex:"#b3654c",img:IMG.cup_tuscan}]},
    { key:"bottle", name:"Beysis 500ml bottle", note:"Insulated drink bottle", colours:[
      {key:"black",name:"Black",hex:"#1a1a1c",img:IMG.bot_black},
      {key:"powderblue",name:"Powder Blue",hex:"#cfe0e8",img:IMG.bot_powderblue},
      {key:"stone",name:"Stone",hex:"#d9d0c5",img:IMG.bot_stone},
      {key:"terracotta",name:"Terracotta",hex:"#c07a53",img:IMG.bot_terracotta}]}
  ];
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function findColour(pk,ck){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].key===pk)for(var j=0;j<PRODUCTS[i].colours.length;j++){if(PRODUCTS[i].colours[j].key===ck)return {p:PRODUCTS[i],c:PRODUCTS[i].colours[j]};}}return null;}
  function prodName(k){var f=k;PRODUCTS.forEach(function(p){if(p.key===k)f=p.name;});return f;}
  function myPick(){var v=ls("ozgrav_gh_pick");if(v){try{return JSON.parse(v);}catch(e){}}return null;}

  var selected=null;

  function tilesHTML(mine){
    var locked=!!mine,out="";
    PRODUCTS.forEach(function(p){
      out+='<section class="group"><div class="group-head"><h2>'+esc(p.name)+'</h2><span class="note">'+esc(p.note)+' · four colours</span></div><div class="tiles">';
      p.colours.forEach(function(c){
        var isMine=mine&&mine.product===p.key&&mine.colour===c.key;
        var press=(!locked&&selected&&selected.product===p.key&&selected.colour===c.key)||isMine;
        var cls="tile"+(locked?" locked":"")+(locked&&!isMine?" dim":"");
        out+='<button type="button" class="'+cls+'" aria-pressed="'+(press?"true":"false")+'" data-p="'+p.key+'" data-c="'+c.key+'"'+(locked?" disabled":"")+'>'
          +'<span class="ph"><img src="'+c.img+'" alt="'+esc(p.name+" — "+c.name)+'" loading="lazy"></span>'
          +'<span class="meta"><span class="dot" style="background:'+c.hex+'"></span><span class="cname">'+esc(c.name)+'</span></span>'
          +'<span class="check" aria-hidden="true">&#10003;</span></button>';
      });
      out+='</div></section>';
    });
    return out;
  }
  function panelVote(){
    return '<div class="panel">'
      +'<div class="field"><label for="nm">Your name</label><input id="nm" type="text" autocomplete="name" placeholder="e.g. Alex Nguyen" maxlength="80"></div>'
      +'<div class="field"><label for="em">Email <span class="opt">(optional)</span></label><input id="em" type="email" autocomplete="email" placeholder="alex@swin.edu.au" maxlength="120"></div>'
      +'<div class="row"><button id="go" class="btn" disabled>Send my pick</button><span class="pick-hint" id="hint">Pick one product and one colour above.</span></div>'
      +'</div>';
  }
  function panelDone(mine){
    var fc=findColour(mine.product,mine.colour),cname=fc?fc.c.name:mine.colour,hex=fc?fc.c.hex:"#888";
    return '<div class="panel done"><h2>Thanks, '+esc(mine.name)+'.</h2><p>Your pick has been recorded for the retreat order.</p>'
      +'<div class="yourpick"><span class="dot" style="background:'+hex+'"></span>'+esc(prodName(mine.product))+' &middot; '+esc(cname)+'</div>'
      +'<div class="change"><button type="button" class="linkbtn" id="change">Change my pick</button></div></div>';
  }
  function render(){
    var mine=render._force?null:myPick();
    $("app").innerHTML='<div class="wrap">'
      +'<p class="eyebrow">OzGrav &middot; Annual Retreat 2026</p>'
      +'<h1>Pick your merch.</h1>'
      +'<p class="sub">One keepsake for the retreat. Choose <strong>one product</strong> and <strong>one colour</strong>, then add your name so we order the right ones.</p>'
      +'<canvas id="chirp" aria-hidden="true"></canvas>'
      +tilesHTML(mine)
      +(mine?panelDone(mine):panelVote())
      +'<p class="footer">OzGrav — ARC Centre of Excellence for Gravitational Wave Discovery. Questions? <a href="mailto:'+CONTACT+'">'+CONTACT+'</a></p>'
      +'</div>';
    if(mine){var c=$("change");if(c)c.addEventListener("click",function(){render._force=true;selected=null;render();render._force=false;});}
    else{wireVote();}
    drawChirp();
  }
  function wireVote(){
    document.querySelectorAll(".tile").forEach(function(b){
      b.addEventListener("click",function(){
        selected={product:b.getAttribute("data-p"),colour:b.getAttribute("data-c")};
        document.querySelectorAll(".tile").forEach(function(x){x.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");upd();
      });
    });
    var nm=$("nm");if(nm)nm.addEventListener("input",upd);
    var go=$("go");if(go)go.addEventListener("click",submit);
  }
  function upd(){var nm=$("nm"),go=$("go"),h=$("hint");var ok=selected&&nm&&nm.value.trim();if(go)go.disabled=!ok;
    if(h)h.textContent=!selected?"Pick one product and one colour above.":(nm&&nm.value.trim()?"Ready — send your pick.":"Add your name to send.");}

  function finish(resp){ls("ozgrav_gh_pick",JSON.stringify(resp));render();}
  function emailPick(resp){
    var cn=(findColour(resp.product,resp.colour)||{c:{name:resp.colour}}).c.name;
    var body="Name: "+resp.name+"\n"+(resp.email?"Email: "+resp.email+"\n":"")+"Product: "+prodName(resp.product)+"\nColour: "+cn+"\n";
    try{window.location.href="mailto:"+CONTACT+"?subject="+encodeURIComponent("OzGrav retreat merch — "+resp.name)+"&body="+encodeURIComponent(body);}catch(e){}
    finish(resp);
  }
  function submit(){
    var nm=$("nm"),em=$("em");
    var resp={name:nm.value.trim(),email:em?em.value.trim():"",product:selected.product,colour:selected.colour};
    if(!resp.name||!selected)return;
    var go=$("go");if(go){go.disabled=true;go.textContent="Sending…";}
    if(FORM_ENDPOINT){
      var cn=(findColour(resp.product,resp.colour)||{c:{name:resp.colour}}).c.name;
      var fd=new FormData();fd.append("name",resp.name);if(resp.email)fd.append("email",resp.email);
      fd.append("product",prodName(resp.product));fd.append("colour",cn);
      fetch(FORM_ENDPOINT,{method:"POST",headers:{"Accept":"application/json"},body:fd})
        .then(function(r){if(r.ok)finish(resp);else emailPick(resp);})
        .catch(function(){emailPick(resp);});
    } else { emailPick(resp); }
  }
  function drawChirp(){
    var c=$("chirp");if(!c)return;var ctx=c.getContext&&c.getContext("2d");if(!ctx)return;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr=Math.min(window.devicePixelRatio||1,2),t0=null;
    function size(){c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
    function col(){return (getComputedStyle(document.documentElement).getPropertyValue("--accent")||"#5BC7DE").trim();}
    function frame(ts){if(t0==null)t0=ts;var el=(ts-t0)/1000;var w=c.clientWidth,h=c.clientHeight,mid=h/2;
      ctx.clearRect(0,0,w,h);ctx.lineWidth=2;ctx.strokeStyle=col();ctx.globalAlpha=.9;ctx.beginPath();
      for(var x=0;x<=w;x+=2){var u=x/w;var freq=6+Math.pow(u,3)*46;var amp=(h*0.34)*Math.pow(u,1.6);if(u>0.9)amp*=(1-(u-0.9)/0.1);
        var y=mid+Math.sin(u*freq+(reduce?0:el*2.2))*amp;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.stroke();ctx.globalAlpha=1;if(!reduce)requestAnimationFrame(frame);}
    size();if(reduce)frame(0);else requestAnimationFrame(frame);
    if(!drawChirp._b){window.addEventListener("resize",size);drawChirp._b=true;}
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",render);else render();
})();
</script>
</body>
</html>
